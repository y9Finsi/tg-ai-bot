services:
  bot:
    container_name: evabot
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SEMANTICA_URL: ${SEMANTICA_URL:-http://semantica-service:8081}
      SEMANTICA_MODE: ${SEMANTICA_MODE:-active}
      SEMANTICA_TIMEOUT_MS: ${SEMANTICA_TIMEOUT_MS:-180}
      SEMANTICA_MUTATION_TIMEOUT_MS: ${SEMANTICA_MUTATION_TIMEOUT_MS:-2000}
      SEMANTICA_THRESHOLD: ${SEMANTICA_THRESHOLD:-0.65}
      SEMANTICA_LIMIT: ${SEMANTICA_LIMIT:-8}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      semantica-service:
        condition: service_healthy

  semantica-service:
    container_name: evabot_semantica
    build:
      context: ./semantica-service
      args:
        INSTALL_SEMANTICA: ${INSTALL_SEMANTICA:-1}
    restart: unless-stopped
    environment:
      SEMANTICA_URL: http://semantica-service:8081
      SEMANTICA_MODE: ${SEMANTICA_MODE:-disabled}
      SEMANTICA_TIMEOUT_MS: ${SEMANTICA_TIMEOUT_MS:-180}
      SEMANTICA_MUTATION_TIMEOUT_MS: ${SEMANTICA_MUTATION_TIMEOUT_MS:-2000}
      SEMANTICA_THRESHOLD: ${SEMANTICA_THRESHOLD:-0.65}
      SEMANTICA_LIMIT: ${SEMANTICA_LIMIT:-8}
      SEMANTICA_BACKEND: ${SEMANTICA_BACKEND:-semantica}
      SEMANTICA_STATE_PATH: /data/semantica-state.json
    ports:
      - "8081:8081"
    volumes:
      - semantica_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    container_name: evabot_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-db_name}
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database_backup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-db_user} -d $${POSTGRES_DB:-db_name}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: evabot_redis
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  semantica_data:
